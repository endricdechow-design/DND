<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a09" />
  <title>Offline – Dungeon Lobby</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, rgb(180 83 9 / 0.18), transparent 60%), #0c0a09;
      color: #e7e5e4; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; }
    h1 { font-family: Georgia, serif; color: #fde68a; letter-spacing: 0.04em; margin: 16px 0 8px; }
    p { color: #a8a29e; max-width: 22rem; margin: 0 auto 24px; line-height: 1.5; }
    button { background: linear-gradient(#f59e0b, #b45309); color: #0c0a09; border: 0; border-radius: 10px;
      padding: 12px 22px; font-weight: 600; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Keine Verbindung</h1>
    <p>Die Dungeon Lobby braucht Internet, damit alle live dasselbe sehen. Prüf dein WLAN oder deine mobilen Daten.</p>
    <button onclick="location.reload()">Nochmal versuchen</button>
  </div>
</body>
</html>
